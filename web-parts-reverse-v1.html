<style>
:root {
  --nb-bg: #f3f5f8;
  --nb-surface: #ffffff;
  --nb-ink: #1b2836;
  --nb-muted: #5c6c7d;
  --nb-line: #d5dee8;
  --nb-blue: #1d4f91;
  --nb-soft: #e6eef8;
  --nb-danger-bg: #fde8e6;
  --nb-danger: #6f221c;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--nb-bg); color: var(--nb-ink); }
body {
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
  font-size: 16px;
  line-height: 1.6;
}
img { max-width: 100%; }
button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
:focus-visible { outline: 3px solid var(--nb-blue); outline-offset: 2px; }
.nb-wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
.nb-wrap, #panel, .nb-try, .nb-try > div, .nb-controls { min-width: 0; }
.nb-header { margin-bottom: 20px; }
h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.3; }
h2 { margin: 24px 0 8px; font-size: 22px; line-height: 1.4; }
h3 { margin: 18px 0 8px; font-size: 18px; line-height: 1.4; }
.nb-lead, .nb-kicker { margin: 0 0 8px; }
.nb-kicker, .nb-help, .nb-foot, .nb-filemeta { color: var(--nb-muted); }
.nb-foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--nb-line); }
.nb-picks { display: grid; gap: 16px; }
.nb-pick {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  width: 100%;
  min-height: 180px;
  padding: 20px;
  border: 1px solid var(--nb-line);
  border-radius: 16px;
  background: var(--nb-surface);
  color: inherit;
  font: inherit;
  text-align: left;
}
.nb-pick:hover { border-color: var(--nb-blue); background: var(--nb-soft); }
.nb-pick strong { font-size: 20px; line-height: 1.4; }
.nb-pick-cta { margin-top: auto; color: var(--nb-blue); font-weight: 700; }
.nb-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  margin: 0 0 4px;
  padding: 8px 0;
  border: 0;
  background: transparent;
  color: var(--nb-blue);
  font: inherit;
}
.nb-tabs, .nb-subtabs, .nb-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.nb-tabs { margin: 16px 0; }
.nb-btn, .nb-tabs button, .nb-subtabs button {
  min-height: 44px;
  padding: 10px 14px;
  border: 1px solid var(--nb-blue);
  border-radius: 8px;
  background: var(--nb-surface);
  color: var(--nb-blue);
  font: inherit;
  font-size: 16px;
  line-height: 1.3;
}
.nb-btn.primary, .nb-tabs button[aria-selected="true"], .nb-subtabs button[aria-selected="true"] {
  background: var(--nb-blue);
  color: #fff;
}
.nb-try { display: grid; gap: 20px; }
.nb-frame {
  display: block;
  width: 100%;
  height: min(70vh, 640px);
  min-height: 420px;
  border: 1px solid var(--nb-line);
  border-radius: 12px;
  background: #fff;
}
.nb-note, .nb-alert, .nb-confirm {
  margin: 0 0 12px;
  padding: 12px;
  border-radius: 8px;
}
.nb-note { background: var(--nb-soft); }
.nb-alert { background: var(--nb-danger-bg); color: var(--nb-danger); }
.nb-confirm { background: #fff; border: 1px solid var(--nb-line); }
.nb-field { display: flex; flex-direction: column; gap: 6px; margin: 0 0 16px; }
.nb-field > span, .nb-choice-title { font-weight: 700; }
.nb-help { margin: 0; }
.nb-input, .nb-area, .nb-select, input[type="file"] {
  width: 100%;
  max-width: 100%;
  font: inherit;
  font-size: 16px;
}
.nb-input, .nb-area, .nb-select {
  padding: 10px 12px;
  border: 1px solid var(--nb-line);
  border-radius: 8px;
  background: #fff;
  color: inherit;
}
.nb-area { min-height: 96px; resize: vertical; }
input[type="range"] { width: 100%; height: 44px; margin: 0; accent-color: var(--nb-blue); }
.nb-choice { display: flex; align-items: flex-start; gap: 8px; min-height: 44px; padding: 8px 0; }
.nb-choice input { width: 22px; height: 22px; margin-top: 2px; flex: 0 0 auto; }
.is-locked { opacity: 0.55; }
.nb-slot {
  margin: 0 0 12px;
  padding: 12px;
  border: 1px solid var(--nb-line);
  border-radius: 12px;
  background: #fff;
}
.nb-thumb { display: block; width: 100%; height: 96px; object-fit: cover; border-radius: 8px; background: var(--nb-soft); }
.nb-code {
  display: block;
  width: 0;
  min-width: 100%;
  margin: 0;
  max-width: 100%;
  overflow: auto;
  padding: 12px;
  border: 1px solid var(--nb-line);
  border-radius: 8px;
  background: #f7f9fb;
  color: var(--nb-ink);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 16px;
  line-height: 1.5;
  white-space: pre;
  tab-size: 2;
}
.nb-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.nb-table th, .nb-table td {
  border: 1px solid var(--nb-line);
  padding: 8px;
  text-align: left;
  vertical-align: top;
  word-break: break-all;
}
.nb-table th { background: var(--nb-soft); }
ol, ul { padding-left: 1.4em; }
#nb-toast {
  position: fixed;
  left: 16px;
  right: 16px;
  bottom: 16px;
  z-index: 30;
  display: none;
  max-width: 560px;
  margin: 0 auto;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--nb-ink);
  color: #fff;
}
#nb-toast.is-on { display: block; }
@media (min-width: 960px) {
  .nb-picks { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .nb-try { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
  .nb-controls { position: sticky; top: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .nb-pick, .nb-btn, .nb-frame { transition: none; }
}

</style>
</head>

<div id="app"></div>
<div id="nb-toast" role="status" aria-live="polite"></div>
<script type="text/plain" id="src-css-reveal">
/* スクロールで順番に現す。wpr- で始め、ページ全体の見出しやボタンには当てない。 */
.wpr-reveal,
.wpr-reveal * { box-sizing: border-box; }
.wpr-reveal {
  --wpr-duration: 600ms;
  --wpr-distance: 25px;
  color: #1b2836;
  font-size: 16px;
  line-height: 1.6;
}
.wpr-reveal-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
}
@media (min-width: 768px) {
  .wpr-reveal-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.wpr-reveal-item { min-width: 0; }
.wpr-reveal-card {
  height: 100%;
  background: #fff;
  border: 1px solid #d5dee8;
  border-radius: 12px;
  overflow: hidden;
}
.wpr-reveal-img {
  display: block;
  width: 100%;
  height: 148px;
  object-fit: cover;
  background: #e6eef8;
}
.wpr-reveal-copy { padding: 14px 16px 16px; }
.wpr-reveal-title {
  margin: 0 0 8px;
  font-size: 20px;
  line-height: 1.4;
  font-weight: 700;
}
.wpr-reveal-text { margin: 0; white-space: pre-wrap; }
.wpr-reveal .wpr-img-fallback {
  display: flex;
  align-items: center;
  min-height: 80px;
  padding: 12px 16px;
  background: #f3f5f8;
  color: #1b2836;
}
/* .wpr-ready は JavaScript の初期化に成功したときだけ付く。付かなければ本文は見えたまま。 */
.wpr-reveal.wpr-ready .wpr-reveal-item { opacity: 0; }
.wpr-reveal.wpr-from-bottom.wpr-ready .wpr-reveal-item { transform: translate3d(0, var(--wpr-distance), 0); }
.wpr-reveal.wpr-from-left.wpr-ready .wpr-reveal-item { transform: translate3d(calc(var(--wpr-distance) * -1), 0, 0); }
.wpr-reveal.wpr-from-right.wpr-ready .wpr-reveal-item { transform: translate3d(var(--wpr-distance), 0, 0); }
.wpr-reveal.wpr-ready .wpr-reveal-item.is-in {
  opacity: 1;
  transform: none;
  transition: opacity var(--wpr-duration) ease-out, transform var(--wpr-duration) ease-out;
}
@media (prefers-reduced-motion: reduce) {
  .wpr-reveal.wpr-ready .wpr-reveal-item {
    opacity: 1;
    transform: none;
    transition: none;
  }
}

</script>
<script type="text/plain" id="src-js-reveal">
/* 学習用。圧縮していない。画面内に入ったカードへクラスを付けるだけで、毎フレーム座標は計算しない。 */
(function () {
  "use strict";
  var MARK = "data-wpr-booted";
  var host = window.__wprScrollReveal;
  if (!host) host = window.__wprScrollReveal = { list: [], bound: false, ticking: false };

  function reduced() {
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function metrics(item) {
    var view = { top: 0, left: 0, right: window.innerWidth, bottom: window.innerHeight, height: window.innerHeight };
    var rect = item.getBoundingClientRect();
    var top = Math.max(rect.top, view.top);
    var bottom = Math.min(rect.bottom, view.bottom);
    var left = Math.max(rect.left, view.left);
    var right = Math.min(rect.right, view.right);
    var ih = bottom - top;
    var iw = right - left;
    var area = rect.width * rect.height;
    var ratio = ih > 0 && iw > 0 && area > 0 ? (ih * iw) / area : 0;
    var tall = rect.height > view.height && ih >= view.height * 0.1 && iw > 0;
    return {
      visible: ratio >= 0.1 || tall,
      fullyOut: rect.bottom < view.top - 8 || rect.top > view.bottom + 8 || rect.right < view.left - 8 || rect.left > view.right + 8
    };
  }

  function notify() {
    host.list.slice().forEach(function (fn) { fn(); });
  }

  if (!host.bound) {
    host.bound = true;
    window.addEventListener("scroll", function () {
      if (host.ticking) return;
      host.ticking = true;
      window.requestAnimationFrame(function () {
        host.ticking = false;
        notify();
      });
    }, true);
    window.addEventListener("resize", notify);
  }

  function boot(root) {
    if (!root || root.getAttribute(MARK) === "1") return;
    root.setAttribute(MARK, "1");
    var items = Array.prototype.slice.call(root.querySelectorAll(".wpr-reveal-item"));
    if (reduced()) {
      items.forEach(function (item) { item.classList.add("is-in"); });
      root.classList.add("wpr-ready");
      return;
    }
    var replay = root.getAttribute("data-wpr-replay") === "repeat" ? "repeat" : "once";
    var stagger = parseInt(root.getAttribute("data-wpr-stagger") || "0", 10);
    if (!isFinite(stagger) || stagger < 0) stagger = 0;
    var timers = new WeakMap();
    var observer = null;

    function cancel(item) {
      var id = timers.get(item);
      if (id) {
        window.clearTimeout(id);
        timers.delete(item);
      }
      item.removeAttribute("data-wpr-pending");
    }

    function arm(list) {
      var fresh = [];
      list.forEach(function (item) {
        if (!item.classList.contains("is-in") && item.getAttribute("data-wpr-pending") !== "1") fresh.push(item);
      });
      fresh.sort(function (a, b) {
        if (a === b) return 0;
        return a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
      });
      fresh.forEach(function (item, index) {
        item.setAttribute("data-wpr-pending", "1");
        var timer = window.setTimeout(function () {
          timers.delete(item);
          if (item.getAttribute("data-wpr-pending") !== "1") return;
          item.removeAttribute("data-wpr-pending");
          if (!item.isConnected || !metrics(item).visible) return;
          item.classList.add("is-in");
          if (replay === "once" && observer) observer.unobserve(item);
        }, stagger * index);
        timers.set(item, timer);
      });
    }

    function sync() {
      if (!root.isConnected) {
        destroy();
        return;
      }
      var entered = [];
      items.forEach(function (item) {
        var state = metrics(item);
        if (state.visible) {
          if (!item.classList.contains("is-in")) entered.push(item);
        } else if (item.getAttribute("data-wpr-pending") === "1") {
          cancel(item);
        }
        if (replay === "repeat" && item.classList.contains("is-in") && state.fullyOut) {
          item.classList.remove("is-in");
          if (observer) observer.observe(item);
        }
      });
      if (entered.length) arm(entered);
    }

    function destroy() {
      if (observer) observer.disconnect();
      items.forEach(cancel);
      var index = host.list.indexOf(sync);
      if (index >= 0) host.list.splice(index, 1);

      root._wprCleanup = null;
    }

    observer = new IntersectionObserver(function () { sync(); }, {
      root: null,
      threshold: [0, 0.1, 0.25, 0.5, 1]
    });
    root._wprCleanup = destroy;
    host.list.push(sync);
    root.classList.add("wpr-ready");
    items.forEach(function (item) { observer.observe(item); });
    sync();
  }

  function init() {
    var nodes = document.querySelectorAll('[data-wpr-part="scroll-reveal"]');
    Array.prototype.forEach.call(nodes, boot);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

</script>
<script type="text/plain" id="src-css-lightbox">
/* クリックで画像を拡大する。ボタンや画像の全体指定はしない。 */
.wpr-lightbox,
.wpr-lightbox * { box-sizing: border-box; }
.wpr-lightbox {
  --wpr-duration: 250ms;
  --wpr-dim: 0.7;
  --wpr-max: 960px;
  color: #1b2836;
  font-size: 16px;
  line-height: 1.6;
}
.wpr-lightbox-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
}
@media (min-width: 560px) {
  .wpr-lightbox-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 900px) {
  .wpr-lightbox-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.wpr-lightbox-thumb {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 44px;
  margin: 0;
  padding: 0;
  border: 1px solid #d5dee8;
  border-radius: 12px;
  background: #fff;
  color: inherit;
  font: inherit;
  text-align: left;
  overflow: hidden;
  cursor: pointer;
}
.wpr-lightbox-thumb img {
  display: block;
  width: 100%;
  height: 168px;
  object-fit: cover;
  background: #e6eef8;
}
.wpr-lightbox-caption {
  display: block;
  padding: 10px 12px 12px;
  white-space: pre-wrap;
}
.wpr-lightbox .wpr-img-fallback,
.wpr-lightbox-missing {
  display: flex;
  align-items: center;
  min-height: 96px;
  padding: 12px;
  background: #f3f5f8;
  color: #1b2836;
}
.wpr-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.wpr-lightbox-dialog {
  position: fixed;
  inset: 0;
  width: min(var(--wpr-max, 960px), calc(100vw - 32px));
  height: fit-content;
  max-height: calc(100vh - 32px);
  margin: auto;
  padding: 0;
  border: 0;
  background: transparent;
  color: #1b2836;
  overflow: auto;
}
.wpr-lightbox-dialog::backdrop {
  background: rgba(17, 24, 32, var(--wpr-dim, 0.7));
}
.wpr-lightbox-panel {
  position: relative;
  max-height: calc(100vh - 32px);
  overflow: auto;
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  opacity: 1;
  transform: none;
}
.wpr-lightbox-close {
  position: sticky;
  top: 0;
  z-index: 1;
  float: right;
  min-width: 44px;
  min-height: 44px;
  margin: 0 0 8px 8px;
  padding: 8px 14px;
  border: 1px solid #1b2836;
  border-radius: 8px;
  background: #fff;
  color: #1b2836;
  font: inherit;
  font-size: 16px;
  line-height: 1.2;
  cursor: pointer;
}
.wpr-lightbox-full {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: calc(100vh - 140px);
  margin: 0 auto;
  object-fit: contain;
  background: #f3f5f8;
}
.wpr-lightbox-dialog-caption {
  margin: 12px 0 0;
  white-space: pre-wrap;
}
.wpr-lightbox-dialog[data-wpr-effect="zoom"]:not(.is-open):not(.is-closing) .wpr-lightbox-panel,
.wpr-lightbox-dialog[data-wpr-effect="fade"]:not(.is-open):not(.is-closing) .wpr-lightbox-panel {
  opacity: 0;
}
.wpr-lightbox-dialog[data-wpr-effect="zoom"]:not(.is-open):not(.is-closing) .wpr-lightbox-panel {
  transform: scale(0.94);
}
.wpr-lightbox-dialog.is-open[data-wpr-effect="zoom"] .wpr-lightbox-panel,
.wpr-lightbox-dialog.is-open[data-wpr-effect="fade"] .wpr-lightbox-panel {
  opacity: 1;
  transform: none;
  transition: opacity var(--wpr-duration) ease-out, transform var(--wpr-duration) ease-out;
}
.wpr-lightbox-dialog.is-closing[data-wpr-effect="zoom"] .wpr-lightbox-panel {
  opacity: 0;
  transform: scale(0.94);
  transition: opacity var(--wpr-duration) ease-out, transform var(--wpr-duration) ease-out;
}
.wpr-lightbox-dialog.is-closing[data-wpr-effect="fade"] .wpr-lightbox-panel {
  opacity: 0;
  transform: none;
  transition: opacity var(--wpr-duration) ease-out, transform var(--wpr-duration) ease-out;
}
@media (prefers-reduced-motion: reduce) {
  .wpr-lightbox-dialog[data-wpr-effect="zoom"]:not(.is-open):not(.is-closing) .wpr-lightbox-panel,
  .wpr-lightbox-dialog[data-wpr-effect="fade"]:not(.is-open):not(.is-closing) .wpr-lightbox-panel,
  .wpr-lightbox-dialog.is-open[data-wpr-effect="zoom"] .wpr-lightbox-panel,
  .wpr-lightbox-dialog.is-open[data-wpr-effect="fade"] .wpr-lightbox-panel,
  .wpr-lightbox-dialog.is-closing[data-wpr-effect="zoom"] .wpr-lightbox-panel,
  .wpr-lightbox-dialog.is-closing[data-wpr-effect="fade"] .wpr-lightbox-panel {
    opacity: 1;
    transform: none;
    transition: none;
  }
}

</script>
<script type="text/plain" id="src-js-lightbox">
/* 学習用。圧縮していない。開く、画像の切り替え、閉じるを一つの終了処理にまとめている。 */
(function () {
  "use strict";
  var MARK = "data-wpr-booted";

  function reduced() {
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function effectOf(root) {
    if (reduced()) return "none";
    var motion = root.getAttribute("data-wpr-motion") || "zoom";
    if (motion === "fade" || motion === "none") return motion;
    return "zoom";
  }

  function durationOf(root) {
    var value = parseInt(root.getAttribute("data-wpr-duration") || "0", 10);
    if (!isFinite(value) || value < 0) return 0;
    return value;
  }

  function boot(root) {
    if (!root || root.getAttribute(MARK) === "1") return;
    var dialog = root.querySelector(".wpr-lightbox-dialog");
    var panel = root.querySelector(".wpr-lightbox-panel");
    var full = root.querySelector(".wpr-lightbox-full");
    var cap = root.querySelector(".wpr-lightbox-dialog-caption");
    var closeBtn = root.querySelector(".wpr-lightbox-close");
    if (!dialog || !panel || !full || !closeBtn) return;
    root.setAttribute(MARK, "1");

    var state = "closed";
    var opener = null;
    var queued = null;
    var savedX = 0;
    var savedY = 0;
    var timer = 0;
    var onEnd = null;

    function backdropOn() {
      return root.getAttribute("data-wpr-backdrop") !== "off";
    }

    function clearTimer() {
      if (timer) {
        window.clearTimeout(timer);
        timer = 0;
      }
      if (onEnd) {
        panel.removeEventListener("transitionend", onEnd);
        onEnd = null;
      }
    }

    function restore() {
      var back = opener;
      opener = null;
      var x = savedX;
      var y = savedY;
      function apply() {
        if (state !== "closed") return;
        if (back && back.isConnected) back.focus({ preventScroll: true });
        window.scrollTo(x, y);
      }
      apply();
      window.setTimeout(apply, 0);
      window.setTimeout(apply, 50);
    }

    function afterClosed() {
      if (state === "closed") return;
      clearTimer();
      dialog.classList.remove("is-open", "is-closing");
      dialog.removeAttribute("data-wpr-effect");

      if (queued && queued.isConnected) {
        var next = queued;
        queued = null;
        openItem(next);
      }

    function finishClose() {
      if (state === "closed") return;
      clearTimer();
      if (dialog.open) dialog.close();

    }

    function requestClose() {

        return;

      dialog.classList.add("is-closing");
      var done = false;
      onEnd = function (event) {

        finishClose();
      };

        finishClose();

    }

    function openItem(button) {
      if (!button || !button.isConnected) return;
      if (state === "opening" || state === "open") return;
      if (state === "closing") {
        queued = button;
        return;
      }
      var img = button.querySelector("img");
      if (!img) return;
      opener = button;
      savedX = window.scrollX;
      savedY = window.scrollY;
      full.alt = img.alt || "";
      full.src = img.currentSrc || img.getAttribute("src") || "";
      var caption = button.querySelector(".wpr-lightbox-caption");
      var text = caption ? caption.textContent : "";
      if (cap) {
        cap.textContent = text;
        cap.hidden = text.trim() === "";
      }

      dialog.setAttribute("data-wpr-effect", effect);
      dialog.classList.remove("is-open", "is-closing");

        if (!dialog.open) dialog.showModal();
      } catch (err) {

      }
      if (effect === "none") {
        state = "open";
        dialog.classList.add("is-open");
        closeBtn.focus({ preventScroll: true });
        return;
      }
      state = "opening";
      window.requestAnimationFrame(function () {
        window.requestAnimationFrame(function () {
          if (state !== "opening") return;
          dialog.classList.add("is-open");
          timer = window.setTimeout(function () {
            if (state === "opening") state = "open";
          }, durationOf(root));
          closeBtn.focus({ preventScroll: true });
        });
      });
    }

    root.addEventListener("click", function (event) {
      var button = event.target.closest(".wpr-lightbox-thumb");
      if (!button || !root.contains(button)) return;
      openItem(button);
    });
    closeBtn.addEventListener("click", function (event) {
      event.preventDefault();
      event.stopPropagation();
      requestClose();
    });
    dialog.addEventListener("click", function (event) {
      if (!backdropOn()) return;
      if (event.target === dialog || (event.target.classList && event.target.classList.contains("wpr-lightbox-dim"))) {
        requestClose();
      }
    });
    dialog.addEventListener("cancel", function (event) {
      event.preventDefault();
      requestClose();
    });
    dialog.addEventListener("keydown", function (event) {
      if (event.key !== "Tab" || !dialog.open) return;
      var nodes = dialog.querySelectorAll("button, a[href], input, select, textarea, [tabindex]");
      var list = [];
      var i;
      for (i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        if (node.disabled || node.tabIndex < 0) continue;
        list.push(node);
      }
      if (!list.length) {
        event.preventDefault();
        return;
      }
      var first = list[0];
      var last = list[list.length - 1];
      var active = document.activeElement;
      if (event.shiftKey) {
        if (active === first || !dialog.contains(active)) {
          event.preventDefault();
          last.focus();
        }
      } else if (active === last || !dialog.contains(active)) {
        event.preventDefault();
        first.focus();
      }
    });
    dialog.addEventListener("close", function () {
      if (state === "closed") return;
      afterClosed();
    });
    panel.addEventListener("click", function (event) {
      event.stopPropagation();
    });
    root.addEventListener("error", function (event) {
      var target = event.target;
      if (!target || target.tagName !== "IMG" || target.classList.contains("wpr-broken")) return;
      target.classList.add("wpr-broken");
      target.hidden = true;
      var note = document.createElement("span");
      note.className = "wpr-img-fallback";
      note.textContent = "この画像を表示できません。選び直すか、配置し直してください。";
      if (target.parentNode) target.parentNode.insertBefore(note, target.nextSibling);
    }, true);
  }

  function init() {
    var nodes = document.querySelectorAll('[data-wpr-part="image-lightbox"]');
    Array.prototype.forEach.call(nodes, boot);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
<script type="text/plain" id="src-css-orbit">
/* 円形に回る画像。JavaScriptが付くまで、普通の一覧として見せる。 */
.wpr-orbit,
.wpr-orbit * { box-sizing: border-box; }
.wpr-orbit {
  --wpr-duration: 350ms;
  --wpr-dim: 0.35;
  --wpr-max: 960px;
  --wpr-card: 160px;
  color: #1b2836;
  font-size: 16px;
  line-height: 1.6;
}
.wpr-orbit-note { margin: 0 0 8px; }
.wpr-orbit-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
}
@media (min-width: 640px) {
  .wpr-orbit-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.wpr-orbit-card,
.wpr-orbit-empty {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 44px;
  margin: 0;
  padding: 0;
  border: 1px solid #d5dee8;
  border-radius: 12px;
  background: #fff;
  color: inherit;
  font: inherit;
  text-align: left;
  overflow: hidden;
}
.wpr-orbit-card { cursor: pointer; }
.wpr-orbit-media { position: relative; background: #e6eef8; }
.wpr-orbit-img,
.wpr-orbit-empty span {
  display: block;
  width: 100%;
  height: 140px;
  object-fit: contain;
  background: #e6eef8;
}
.wpr-orbit-empty span {
  display: flex;
  align-items: center;
  height: auto;
  min-height: 96px;
  padding: 12px;
}
.wpr-orbit-shade {
  position: absolute;
  inset: 0;
  background: #111820;
  opacity: 0;
  pointer-events: none;
}
.wpr-orbit-cap {
  display: block;
  padding: 8px 10px 10px;
  background: #fff;
}
.wpr-orbit-card:focus-visible {
  outline: 3px solid #1d4f91;
  outline-offset: 2px;
}
.wpr-orbit-card.is-source { visibility: hidden; }
.wpr-orbit-tools {
  display: none;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.wpr-orbit.wpr-ready .wpr-orbit-tools { display: flex; }
.wpr-orbit-tools button {
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid #1d4f91;
  border-radius: 8px;
  background: #fff;
  color: #1d4f91;
  font: inherit;
  font-size: 16px;
  line-height: 1.3;
  cursor: pointer;
}
.wpr-orbit-tools button:disabled { opacity: 0.45; cursor: default; }
.wpr-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.wpr-orbit.wpr-ready:not(.wpr-static) .wpr-orbit-stage {
  position: relative;
  width: 100%;
}
.wpr-orbit.wpr-ready:not(.wpr-static) .wpr-orbit-list {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  margin: 0;
}
.wpr-orbit.wpr-ready:not(.wpr-static) .wpr-orbit-item {
  position: absolute;
  width: var(--wpr-card);
  margin: 0;
  transform-origin: center center;
}
.wpr-orbit.wpr-ready:not(.wpr-static) .wpr-orbit-img { height: calc(var(--wpr-card) * 0.62); }
.wpr-orbit-dialog {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  max-width: 100vw;
  max-height: 100vh;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: #1b2836;
  overflow: visible;
}
.wpr-orbit-dialog::backdrop {
  background: rgba(17, 24, 32, var(--wpr-dim, 0.35));
}
.wpr-orbit-fly {
  position: fixed;
  margin: 0;
  padding: 0;
  border-radius: 12px;
  background: #fff;
  overflow: hidden;
}
.wpr-orbit-close {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 1;
  min-width: 44px;
  min-height: 44px;
  padding: 8px 14px;
  border: 1px solid #1b2836;
  border-radius: 8px;
  background: #fff;
  color: #1b2836;
  font: inherit;
  font-size: 16px;
  line-height: 1.2;
  cursor: pointer;
}
.wpr-orbit-full {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #f3f5f8;
  pointer-events: none;
}
.wpr-orbit-fly-shade {
  position: absolute;
  inset: 0;
  background: #111820;
  pointer-events: none;
}
.wpr-orbit-dialog-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  margin: 0;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.94);
  white-space: pre-wrap;
}
.wpr-orbit .wpr-img-fallback {
  display: flex;
  align-items: center;
  min-height: 96px;
  padding: 12px;
  background: #f3f5f8;
}

</script>
<script type="text/plain" id="src-js-orbit">
/* 学習用。圧縮していない。楕円の位置は角度から決め、選んだ画像だけを元位置から前面へ動かす。 */
(function () {
  "use strict";
  var MARK = "data-wpr-booted";
  var TAU = Math.PI * 2;

  function reduced() {
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function numAttr(root, name, fallback) {
    var value = parseFloat(root.getAttribute(name) || "");
    return isFinite(value) ? value : fallback;
  }

  function boot(root) {
    if (!root || root.getAttribute(MARK) === "1") return;
    var stage = root.querySelector(".wpr-orbit-stage");
    var list = root.querySelector(".wpr-orbit-list");
    var dialog = root.querySelector(".wpr-orbit-dialog");
    var fly = root.querySelector(".wpr-orbit-fly");
    var full = root.querySelector(".wpr-orbit-full");
    var flyShade = root.querySelector(".wpr-orbit-fly-shade");
    var cap = root.querySelector(".wpr-orbit-dialog-caption");
    var closeBtn = root.querySelector(".wpr-orbit-close");
    var pauseBtn = root.querySelector(".wpr-orbit-pause");
    var prevBtn = root.querySelector(".wpr-orbit-prev");
    var nextBtn = root.querySelector(".wpr-orbit-next");
    var note = root.querySelector(".wpr-orbit-note");
    if (!stage || !list || !dialog || !fly || !full || !closeBtn || !pauseBtn || !prevBtn || !nextBtn) return;
    root.setAttribute(MARK, "1");

    var items = Array.prototype.slice.call(root.querySelectorAll(".wpr-orbit-item"));
    var N = items.length;
    var phase = 0;
    var metrics = null;
    var manualHold = root.getAttribute("data-wpr-auto") === "off" || N < 3 || reduced();
    var hoverHold = false;
    var focusHold = false;
    var offHold = false;
    var hiddenHold = document.visibilityState === "hidden";
    var enlargeHold = false;
    var graceFocus = false;
    var quietFocus = false;
    var modality = "pointer";
    var wasPlaying = false;
    var reopenFocusHold = false;
    var opener = null;
    var queued = null;
    var savedX = 0;
    var savedY = 0;
    var state = "closed";
    var anim = null;
    var timer = 0;
    var moveGen = 0;
    var nudge = null;
    var lastTime = null;
    var raf = 0;
    var alive = true;

    function period() {
      var value = numAttr(root, "data-wpr-period", 24);
      return value > 0 ? value : 24;
    }

    function durationOf() {
      var value = numAttr(root, "data-wpr-duration", 350);
      return value > 0 ? value : 0;
    }

    function dirSign() {
      return root.getAttribute("data-wpr-direction") === "left" ? -1 : 1;
    }

    function spinning() {
      return alive && N >= 3 && !reduced() && !manualHold && !hoverHold && !focusHold && !offHold && !hiddenHold && !enlargeHold && !nudge && state === "closed";
    }

    function label() {
      pauseBtn.textContent = manualHold || reduced() || N < 3 ? "回転を再開" : "回転を止める";
      pauseBtn.setAttribute("aria-pressed", manualHold ? "true" : "false");
      root.classList.toggle("is-playing", spinning());
    }

    function measure() {
      if (N < 3) {
        root.classList.add("wpr-ready", "wpr-static");
        stage.style.height = "";
        list.style.height = "";
        items.forEach(function (item) {
          item.style.left = "";
          item.style.top = "";
          item.style.transform = "";
          item.style.zIndex = "";
        });
        return true;
      }
      var width = stage.clientWidth || root.clientWidth;
      if (width < 40) return false;
      var pad = 10;
      var card = Math.floor(Math.max(92, Math.min(210, width * 0.32)));
      var rx = Math.max(36, Math.floor(width / 2 - card / 2 - pad));
      var thick = numAttr(root, "data-wpr-thick", 0.4);
      if (thick < 0.2) thick = 0.2;
      if (thick > 0.75) thick = 0.75;
      var ry = Math.max(28, Math.floor(rx * thick));
      var cardH = Math.floor(card * 0.72 + 44);
      var stageH = Math.floor(ry * 2 + cardH + pad * 2);
      stage.style.height = stageH + "px";
      list.style.height = stageH + "px";
      root.style.setProperty("--wpr-card", card + "px");
      root.classList.add("wpr-ready");
      root.classList.remove("wpr-static");
      metrics = { cx: width / 2, cy: stageH / 2, rx: rx, ry: ry };
      return true;
    }

    function layout() {
      if (N < 3 || !metrics) return;
      var backScale = numAttr(root, "data-wpr-back-scale", 0.65);
      var backBright = numAttr(root, "data-wpr-back-bright", 0.6);
      var i;
      for (i = 0; i < N; i++) {
        var angle = phase + i * TAU / N;
        var depth = (Math.cos(angle) + 1) / 2;
        var scale = backScale + (1 - backScale) * depth;
        var bright = backBright + (1 - backBright) * depth;
        var x = metrics.cx + metrics.rx * Math.sin(angle);
        var y = metrics.cy + metrics.ry * Math.cos(angle);
        var item = items[i];
        item.style.left = x + "px";
        item.style.top = y + "px";
        item.style.zIndex = String(Math.round(depth * 1000) + i);
        item.style.transform = "translate(-50%, -50%) scale(" + scale.toFixed(4) + ")";
        var shade = item.querySelector(".wpr-orbit-shade");
        if (shade) shade.style.opacity = String(Math.max(0, Math.min(1, 1 - bright)));
      }
      root.classList.toggle("is-playing", spinning());
    }

    function kick() {
      label();
      if (!raf) raf = window.requestAnimationFrame(tick);
    }

    function tick(now) {
      raf = window.requestAnimationFrame(tick);
      if (!alive) return;
      if (nudge) {
        nudge(now);
        return;
      }
      if (!spinning()) {
        lastTime = null;
        root.classList.toggle("is-playing", false);
        return;
      }
      if (lastTime == null) lastTime = now;
      var dt = now - lastTime;
      lastTime = now;
      if (dt < 0) dt = 0;
      if (dt > 48) dt = 48;
      phase += dirSign() * (dt / 1000) * TAU / period();

    }

    function normSigned(delta) {
      var turn = TAU;
      var value = delta % turn;
      if (value > Math.PI) value -= turn;
      if (value < -Math.PI) value += turn;
      return value;
    }

    function phaseFor(index) {
      return -index * TAU / N;
    }

    function frontIndex() {
      var best = 0;
      var bestDist = Infinity;
      var i;
      for (i = 0; i < N; i++) {
        var angle = (phase + i * TAU / N) % TAU;
        if (angle < 0) angle += TAU;
        var dist = Math.min(angle, TAU - angle);
        if (dist < bestDist - 0.0001 || (Math.abs(dist - bestDist) < 0.0001 && i < best)) {
          bestDist = dist;
          best = i;
        }
      }
      return best;
    }

    function spinTo(index, instant) {
      if (N < 3) return;
      var delta = normSigned(phaseFor(index) - phase);
      if (instant || reduced()) {
        nudge = null;
        phase += delta;
        layout();
        return;
      }
      var start = phase;
      var t0 = 0;
      nudge = function (now) {
        if (!t0) t0 = now;
        var p = Math.min(1, (now - t0) / 420);
        var eased = 1 - Math.pow(1 - p, 3);
        phase = start + delta * eased;
        layout();
        if (p >= 1) nudge = null;
      };
      kick();
    }

    function step(sign) {
    if (N < 3 || state !== "closed") return;
    manualHold = true;
    var front = frontIndex();
    var target = sign > 0

      : (dirSign() > 0 ? (front + 1) % N : (front - 1 + N) % N);
    spinTo(target, reduced());
    label();
  }

    function indexOf(card) {
      var item = card.closest(".wpr-orbit-item");
      return item ? items.indexOf(item) : -1;
    }

    function clearTimer() {
      if (timer) {
        window.clearTimeout(timer);
        timer = 0;
      }
    }

    function applyRect(rect) {
      fly.style.position = "fixed";
      fly.style.left = rect.left + "px";
      fly.style.top = rect.top + "px";
      fly.style.width = Math.max(1, rect.width) + "px";
      fly.style.height = Math.max(1, rect.height) + "px";
    }

    function sourceNode() {
      return opener && opener.isConnected ? opener.querySelector(".wpr-orbit-img") : null;
    }

    function contentRect(img) {
      var box = img.getBoundingClientRect();
      var nw = img.naturalWidth;
      var nh = img.naturalHeight;
      if (!nw || !nh || box.width < 2 || box.height < 2) {
        return { left: box.left, top: box.top, width: box.width, height: box.height };
      }
      var scale = Math.min(box.width / nw, box.height / nh);
      var w = nw * scale;
      var h = nh * scale;
      return {
        left: box.left + (box.width - w) / 2,
        top: box.top + (box.height - h) / 2,
        width: w,
        height: h
      };
    }

    function sourceRect() {
      var img = sourceNode();
      if (!img) return null;
      var rect = contentRect(img);
      if (rect.width < 2 || rect.height < 2) return null;
      return rect;
    }

    function targetRect() {
      var img = sourceNode() || full;
      var pad = 16;
      var maxW = Math.min(numAttr(root, "data-wpr-max", 960) || 960, window.innerWidth - pad * 2);
      var maxH = window.innerHeight - pad * 2;
      var nw = img.naturalWidth;
      var nh = img.naturalHeight;
      if (!nw || !nh) {
        var box = img.getBoundingClientRect();
        nw = box.width || 320;
        nh = box.height || 200;
      }
      var ratio = nw / Math.max(1, nh);
      var w = maxW;
      var h = w / ratio;
      if (h > maxH) {
        h = maxH;
        w = h * ratio;
      }
      return {
        left: Math.round((window.innerWidth - w) / 2),
        top: Math.round((window.innerHeight - h) / 2),
        width: Math.round(w),
        height: Math.round(h)
      };
    }

    function shadeOf(card) {
      var shade = card ? card.querySelector(".wpr-orbit-shade") : null;
      if (!shade) return 0;
      var value = parseFloat(shade.style.opacity || window.getComputedStyle(shade).opacity || "0");
      return isFinite(value) ? value : 0;
    }

    function paintShade(value) {
      if (!flyShade) return;
      flyShade.style.opacity = String(value);
    }

    function move(from, to, shadeFrom, shadeTo, done) {
      moveGen += 1;
      var gen = moveGen;
      clearTimer();
      if (anim) {
        anim.cancel();
        anim = null;
      }
      applyRect(from);
      paintShade(shadeFrom);
      var finish = function () {
        if (gen !== moveGen) return;
        moveGen += 1;
        if (anim) {
          try { if (anim.commitStyles) anim.commitStyles(); } catch (err) {}
          anim.cancel();
          anim = null;
        }
        applyRect(to);
        paintShade(shadeTo);
        done();
      };
      if (reduced()) {
        finish();
        return;
      }
      anim = fly.animate([
        { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px" },
        { left: to.left + "px", top: to.top + "px", width: to.width + "px", height: to.height + "px" }
      ], { duration: durationOf(), easing: "ease-out", fill: "forwards" });
      if (flyShade) {
        flyShade.animate([{ opacity: shadeFrom }, { opacity: shadeTo }], { duration: durationOf(), easing: "ease-out", fill: "forwards" });
      }
      anim.onfinish = finish;
      timer = window.setTimeout(finish, durationOf() + 90);
    }

    function haltAtCurrent() {
      moveGen += 1;
      clearTimer();
      var rect = fly.getBoundingClientRect();
      if (anim) {
        anim.cancel();
        anim = null;
      }
      if (rect.width > 1) applyRect(rect);
      return rect;
    }

    function restore() {
      var back = opener;
      var x = savedX;
      var y = savedY;
      function apply() {
        if (state !== "closed") return;
        quietFocus = true;
        if (back && back.isConnected) back.focus({ preventScroll: true });
        quietFocus = false;
        window.scrollTo(x, y);
      }
      apply();
      window.setTimeout(apply, 0);
      window.setTimeout(apply, 50);
    }

    function afterClosed() {
      if (state === "closed") return;
      clearTimer();
      if (anim) {
        anim.cancel();
        anim = null;

        '<dialog class="wpr-orbit-dialog" aria-label="拡大画像"><div class="wpr-orbit-fly"><button type="button" class="wpr-orbit-close">閉じる</button><img class="wpr-orbit-full" alt=""><span class="wpr-orbit-fly-shade" aria-hidden="true"></span><p class="wpr-orbit-dialog-caption" hidden></p></div></dialog></section>';
    }
    var light = state.settings;
    var motion = light.motion === "fade" || light.motion === "none" ? light.motion : "zoom";
    var cards = "";
    for (var n = 0; n < state.count; n++) {
      var item = state.slots[n];
      var photo = item.image && item.image.source !== "empty" ? item.image : null;
      if (!photo) {
        cards += '<li><div class="wpr-lightbox-missing">画像がありません。JPEG、PNG、WebPを選び直してください。</div></li>';
        continue;
      }
      var caption = item.caption && String(item.caption).trim()
        ? '<span class="wpr-lightbox-caption">' + esc(item.caption) + "</span>"
        : "";
      cards += '<li><button type="button" class="wpr-lightbox-thumb" aria-haspopup="dialog"><img src="' +
        esc(srcFor(part, state, n, photo, mode)) + '" alt="' + esc(item.alt) + '">' + caption +
        '<span class="wpr-sr">拡大して見る</span></button></li>';
    }
    var dim = (Number(light.dim) / 100).toFixed(2);
    return mark + '<section class="wpr-lightbox" data-wpr-part="image-lightbox" data-wpr-id="' + esc(state.instanceId) +
      '" data-wpr-motion="' + motion + '" data-wpr-duration="' + String(light.duration) + '" data-wpr-backdrop="' +
      (light.backdrop ? "on" : "off") + '" style="--wpr-duration:' + String(light.duration) + "ms;--wpr-dim:" + dim +
      ";--wpr-max:" + String(light.maxWidth) + 'px"><ul class="wpr-lightbox-list">' + cards + "</ul>" +
      '<dialog class="wpr-lightbox-dialog" aria-label="拡大画像" style="--wpr-duration:' + String(light.duration) + "ms;--wpr-dim:" + dim + ";--wpr-max:" + String(light.maxWidth) + 'px"><div class="wpr-lightbox-panel"><button type="button" class="wpr-lightbox-close">閉じる</button>' +
      '<img class="wpr-lightbox-full" alt=""><p class="wpr-lightbox-dialog-caption" hidden></p></div></dialog></section>';
  }

  function toast(message) {
    var node = document.getElementById("nb-toast");
    node.textContent = message;
    node.classList.add("is-on");
    window.clearTimeout(toast._t);
    toast._t = window.setTimeout(function () { node.classList.remove("is-on"); }, 2400);
  }

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function selectCode() {
    var pre = document.getElementById("code-block");
    if (!pre) return;
    pre.tabIndex = 0;
    pre.focus();
    var range = document.createRange();
    range.selectNodeContents(pre);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function copyCode() {
    var text = currentCode();
    var done = function () { toast("コピーしました"); };
    var fail = function () {
      selectCode();
      toast("コピーできない場合は、このコードを選択してコピーしてください");
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(fail);
    } else fail();
  }

  function hasUserImage(state) {
    return state.slots.some(function (slot) { return slot.image && slot.image.source === "user"; });
  }

  function usedBytes(state, exceptIndex) {
    var sum = 0;
    state.slots.forEach(function (slot, index) {
      if (index === exceptIndex) return;
      if (slot.image && slot.image.source === "user") sum += slot.image.bytes || 0;
    });
    return sum;
  }

  function mb(bytes) {
    return (bytes / (1024 * 1024)).toFixed(1) + "MB";
  }

      '<button type="button" class="nb-pick" data-part="scroll-reveal"><strong>スクロールすると順番に現れる</strong><span>商品・実績・特徴を、読み進めるタイミングで表示</span><span class="nb-pick-cta">スクロールして試す</span></button>' +

      '<button type="button" class="nb-pick" data-part="orbit-gallery"><strong>円形に回る画像を、手前に拡大【応用】</strong><span>奥行きのある輪から、選んだ1枚が前面に出る</span><span class="nb-pick-cta">回転を試す</span></button>' +
      "</div>" + foot() + "</div>";

    return '<div id="settings"><h2>動き</h2>' +
      '<div class="nb-field"><span class="nb-choice-title">出現方向</span>' +

      fieldRange("set-stagger", "項目ごとの時間差", 0, 250, 50, s.stagger, "ミリ秒", "同時に画面へ入った項目だけ、この間隔で順番に出します。0なら同時です。", false) +
      fieldRange("set-distance", "移動距離", 0, 60, 5, s.distance, "ピクセル", "移動なしのときは、この欄は使えません。", s.direction === "none") +
      '<div class="nb-field"><span class="nb-choice-title">再表示</span>' +

  function slotsHtml(state) {

    html += "</select></label>";
    if (orbit) html += '<p class="nb-help">3枚以上で輪になって回ります。1〜2枚のときは、回転せずにその場で拡大できます。</p>';

  function learnHtml() {
    var state = partState();
    var s = state.settings;
    if (ui.part === "scroll-reveal") {
      return '<h2>処理の順番</h2><p>JavaScriptが毎フレーム座標を計算し続ける必要はありません。画面に入ったタイミングでクラスを付け、見た目の変化はCSSが行います。</p><ol>' +
        "<li><h3>HTML：動かすカードを用意する</h3><p>並べた要素が、その並びのまま対象になります。左右の位置では順番を決めません。</p><pre class=\"nb-code\">" + esc('<li class="wpr-reveal-item"><article class="wpr-reveal-card">…</article></li>') + "</pre></li>" +
        "<li><h3>CSS：待機中の透明度と位置、表示後の状態、動く時間を指定する</h3><p>いまの動きの時間は" + s.duration + "ミリ秒、時間差は" + s.stagger + "ミリ秒、移動距離は" + (s.direction === "none" ? "0" : s.distance) + "ピクセルです。イージングはease-outで固定です。</p><pre class=\"nb-code\">" + esc(".wpr-reveal.wpr-ready .wpr-reveal-item { opacity: 0; }\n.wpr-reveal.wpr-ready .wpr-reveal-item.is-in { opacity: 1; transform: none; }") + "</pre></li>" +
        "<li><h3>JavaScript：画面に入ったことを検知する</h3><p>IntersectionObserverが、表示領域との交差を知らせます。交差率10%を基本にし、画面より極端に高い要素は、画面の高さの10%が見えたときも対象にします。</p><pre class=\"nb-code\">" + esc("new IntersectionObserver(sync, { root: null, threshold: [0, 0.1] });") + "</pre></li>" +
        "<li><h3>JavaScript：表示用のクラスを付ける</h3><p>同じタイミングで入った項目だけを、HTMLの順に 0、時間差、時間差×2… と遅らせます。</p><pre class=\"nb-code\">" + esc('item.classList.add("is-in");') + "</pre></li>" +
        "<li><h3>CSS：クラスの変更に応じて、見た目が変わる</h3><p>.wpr-ready が付く前は透明にしません。スクリプトが動かなくても本文は読めます。</p></li></ol>";
    }
    if (ui.part === "orbit-gallery") {
      return '<h2>処理の順番</h2><p>スクロール表示と画像拡大のあとに試す応用です。三角関数の暗記は要りません。設定を変えると、速さ・暗さ・厚みが変わります。CSSが見た目、JavaScriptが角度と再生を担当します。</p><ol>' +
        "<li><h3>円に並べる</h3><p>画像ボタンを、横長の楕円の上に置きます。入力した順番のまま、等間隔です。</p><pre class=\"nb-code\">" + esc("var angle = phase + index * Math.PI * 2 / count;\nvar x = centerX + radiusX * Math.sin(angle);\nvar y = centerY + radiusY * Math.cos(angle);") + "</pre></li>" +
        "<li><h3>奥行きを作る</h3><p>手前を大きく明るく、奥を小さく暗くします。暗さは画像の上の暗い膜で表し、説明文までは暗くしません。いまの奥の明るさは" + s.backBright + "%、奥の大きさは" + s.backScale + "%、厚みは" + s.thick + "%です。</p><pre class=\"nb-code\">" + esc("var depth = (Math.cos(angle) + 1) / 2;\nvar scale = backScale + (1 - backScale) * depth;") + "</pre></li>" +
        "<li><h3>少しずつ位置を進める</h3><p>1周の時間はいま" + s.period + "秒です。経過した時間から角度を足すので、画面の細かさが違っても1周の長さは変わりません。</p><pre class=\"nb-code\">" + esc("phase += direction * (delta / 1000) * Math.PI * 2 / period;") + "</pre></li>" +
        "<li><h3>選択したら止める</h3><p>画像を選ぶ、マウスが輪の上にある、キーボードで操作している、画面の外、別のタブ、拡大中は止めます。止める理由が一つでも残っている間は再開しません。</p></li>" +
        "<li><h3>元位置から拡大する</h3><p>中央に別の画像を出すのではなく、押した画像が今の位置から中央へ移動します。時間は" + s.duration + "ミリ秒、イージングはease-outです。</p><pre class=\"nb-code\">" + esc('fly.animate(frames, { duration: duration, easing: "ease-out" });') + "</pre></li>" +
        "<li><h3>戻して再開する</h3><p>閉じると同じ画像が元の位置へ戻り、開く前に回っていたときだけ再開します。手動で止めていた場合は止めたままです。</p></li></ol>";
    }
    return '<h2>処理の順番</h2><p>一覧、押した画像の特定、開く／閉じる、見た目は分けて考えます。いまの開閉は' + (s.motion === "fade" ? "フェードのみ" : s.motion === "none" ? "なし" : "ズーム＋フェード") + "、時間は" + s.duration + "ミリ秒、背景の暗さは" + s.dim + "%、最大幅は" + s.maxWidth + "ピクセルです。</p><ol>" +
      "<li><h3>HTML：一覧と拡大表示を用意する</h3><p>サムネイルは button です。拡大側は dialog を1つだけ持ち、前後の画像へ移動する操作はありません。</p><pre class=\"nb-code\">" + esc('<button type="button" class="wpr-lightbox-thumb"><img alt="画像の説明"></button>\n<dialog class="wpr-lightbox-dialog">…</dialog>') + "</pre></li>" +
      "<li><h3>JavaScript：クリックで、押された画像を特定する</h3><p>ボタンの中の img から、拡大画像のアドレスと代替テキストをコピーします。</p></li>" +
      "<li><h3>JavaScript：開く／閉じる</h3><p>dialog.showModal() で開きます。閉じるボタン、Esc、許可した背景クリックは、同じ終了処理へ集めます。動きが終わる前に dialog を閉じないようにします。</p></li>" +
      "<li><h3>CSS：背景とサイズと動きを決める</h3><p>サムネイルは枠に合わせて切り取り、拡大後は縦横比を保って全体を見せます。最大幅は上限で、画面の外へ閉じるボタンを出しません。</p></li></ol>";
  }

  function methodHtml() {

      ? "<ol><li>制作中のHTML、CSS、JavaScriptをコピーして、戻せる状態にします。</li><li>HTML断片を、bodyの中の表示したい場所へ貼ります。ページ全体の雛形は足しません。</li><li>必要な画像を、対応表の名前で images フォルダーへ置きます。見本素材だけの場合、この作業はありません。</li><li>出力したCSSを、既存CSSの末尾へ追記するか、" + esc(css) + " として保存して head から読み込みます。</li><li>出力したJavaScriptを " + esc(js) + " として保存します。</li><li>そのファイルを読み込む script を、body終了タグの直前に1回だけ置きます。<pre class=\"nb-code\">" + esc('<script src="' + js + '"></' + "script>") + "</pre>既存ファイルへJavaScriptを追記した場合は、そのファイルを二重に読み込ませないでください。</li><li>保存したHTMLを外部のブラウザーで開き、動作を確認します。</li></ol>"

      : ui.part === "orbit-gallery"
        ? "<p>既存の画像一覧へクラスを1つ足すだけでは、この輪にはなりません。1枚ずつの画像と説明を、専用のステージへ移します。</p><h3>変更前</h3><pre class=\"nb-code\">" + esc("<ul class=\"photos\">\n  <li><img src=\"photo.jpg\" alt=\"作業机\"></li>\n</ul>") + "</pre><h3>変更後</h3><pre class=\"nb-code\">" + esc("<!-- 専用のステージ、画像ボタン、回転の操作、拡大用 dialog が必要 -->\n<section class=\"wpr-orbit\" data-wpr-part=\"orbit-gallery\" data-wpr-auto=\"on\" data-wpr-period=\"24\">\n  <div class=\"wpr-orbit-stage\">\n    <ul class=\"wpr-orbit-list\">\n      <li class=\"wpr-orbit-item\"><button type=\"button\" class=\"wpr-orbit-card\"><img class=\"wpr-orbit-img\" src=\"photo.jpg\" alt=\"作業机\"></button></li>\n    </ul>\n  </div>\n</section>") + "</pre><p>回転のボタンと拡大用 dialog は、書き出したHTML断片にあるものを同じパーツの内側へ置きます。</p>"
        : "<p>既存の画像を button で包み、dialog をそのパーツの中へ置きます。リンクの中へ、さらにボタンは入れません。リンク画像なら、そのリンクをボタンへ置き換えます。</p><h3>変更前</h3><pre class=\"nb-code\">" + esc("<a href=\"photo.jpg\"><img src=\"photo.jpg\" alt=\"作業机\"></a>") + "</pre><h3>変更後</h3><pre class=\"nb-code\">" + esc("<!-- a の中に button を入れず、a を button へ置き換える -->\n<button type=\"button\" class=\"wpr-lightbox-thumb\">\n  <img src=\"photo.jpg\" alt=\"作業机\">\n  <span class=\"wpr-sr\">拡大して見る</span>\n</button>") + "</pre><p>拡大用の dialog は、書き出したHTML断片にあるものを、同じパーツの内側へ置きます。</p>";
    return '<div class="nb-subtabs" role="tablist" aria-label="組み込み方"><button type="button" id="method-new" aria-selected="' + (onNew ? "true" : "false") + '">A 新しいパーツをそのまま追加する</button><button type="button" id="method-existing" aria-selected="' + (onNew ? "false" : "true") + '">B 今あるカードや画像に動きを付ける</button></div>' + guide;
  }

  function embedHtml(state) {
    var kinds = [["html", "HTML"], ["css", "CSS"], ["js", "JavaScript"]];

      mappingHtml(state) + '<div class="nb-subtabs" role="tablist" aria-label="コードの種類">' + tabs + '</div><pre class="nb-code" id="code-block" tabindex="0" aria-label="書き出したコード"></pre>' +
      '<div class="nb-actions"><button type="button" class="nb-btn primary" id="btn-copy">コピー</button><button type="button" class="nb-btn" id="btn-save-code">ファイルとして保存</button><button type="button" class="nb-btn" id="btn-save-example">確認用HTMLを保存</button></div>' +

      "<h2>動かない場合に見る項目</h2><ol><li>画像のパスが、対応表の配置名と一致しているか。</li><li>CSSを読み忘れているか。追記した場合は、そのファイルを保存したか。</li><li>JavaScriptを読み忘れているか。script は body 終了タグの直前に1回だけか。</li><li>クラス名と data-wpr-part が、書き出した断片と一致しているか。</li><li>同じ script を二重に読み込んでいないか。</li><li>ブラウザーのコンソールにエラーが出ていないか。</li></ol><p>直らないときも、!important を増やして上書きする方法には進まないでください。読み込み順とクラス名を先に確認します。</p>";

  function partHtml() {
    var state = partState();

  function fillSlots(state) {
    var bytes = usedBytes(state, -1);
    var usage = document.getElementById("nb-usage");
    if (usage) usage.textContent = "現在の取り込み " + mb(bytes) + " / " + (ui.part === "orbit-gallery" ? "20MB" : "12MB");
    for (var i = 0; i < state.count; i++) {
      var slot = state.slots[i];
      var title = document.getElementById("slot-" + i + "-title");
      var body = document.getElementById("slot-" + i + "-body");
      var alt = document.getElementById("slot-" + i + "-alt");
      var caption = document.getElementById("slot-" + i + "-caption");
      var preview = document.getElementById("slot-" + i + "-preview");
      var meta = document.getElementById("slot-" + i + "-meta");
      var clear = document.getElementById("slot-" + i + "-clear");
      if (title) title.value = slot.title;
      if (body) body.value = slot.body;
      if (alt) alt.value = slot.alt;
      if (caption) caption.value = slot.caption;
      var image = slot.image;
      if (preview) {
        if (image && image.source !== "empty" && image.dataUrl) {
          preview.hidden = false;
          preview.src = image.dataUrl;
          preview.alt = slot.alt || "選択中の画像";
        } else preview.hidden = true;
      }
      if (meta) {
        if (!image || image.source === "empty") meta.textContent = "画像なし";
        else if (image.source === "builtin") meta.textContent = "見本素材";
        else meta.textContent = image.name + "（" + mb(image.bytes || 0) + "）";
      }
      if (clear) clear.disabled = !image || image.source === "empty";
    }
  }

  function refreshCode() {
    var pre = document.getElementById("code-block");
    if (pre) pre.textContent = currentCode();
  }

  function patchPreview() {
    var frame = document.getElementById("preview-frame");
    if (!frame || !frame.contentDocument || !frame.contentDocument.body) return;
    var doc = frame.contentDocument;
    var state = partState();
    var root = doc.querySelector("[data-wpr-part]");
    if (!root) return;
    if (ui.part === "scroll-reveal") {
      var cards = root.querySelectorAll(".wpr-reveal-item");
      if (cards.length !== state.count) return;
      for (var i = 0; i < cards.length; i++) {
        var slot = state.slots[i];
        var title = cards[i].querySelector(".wpr-reveal-title");
        var text = cards[i].querySelector(".wpr-reveal-text");
        var img = cards[i].querySelector(".wpr-reveal-img");
        if (title) title.textContent = slot.title;
        if (text) text.textContent = slot.body;
        if (img) img.alt = slot.alt;
      }
      return;
    }
    if (ui.part === "orbit-gallery") {
      var orbitCards = root.querySelectorAll(".wpr-orbit-card");
      var orbitExpected = 0;
      for (var oi = 0; oi < state.count; oi++) if (state.slots[oi].image && state.slots[oi].image.source !== "empty") orbitExpected++;
      if (orbitCards.length !== orbitExpected) return;
      var orbitIndex = 0;
      for (var ok = 0; ok < state.count; ok++) {
        var orbitItem = state.slots[ok];
        if (!orbitItem.image || orbitItem.image.source === "empty") continue;
        var orbitCard = orbitCards[orbitIndex++];
        var orbitImg = orbitCard.querySelector("img");
        var orbitCap = orbitCard.querySelector(".wpr-orbit-cap");
        if (orbitImg) orbitImg.alt = orbitItem.alt;
        if (orbitCap) orbitCap.textContent = orbitItem.caption;
      }
      return;
    }
    var buttons = root.querySelectorAll(".wpr-lightbox-thumb");
    var expected = 0;
    for (var n = 0; n < state.count; n++) if (state.slots[n].image && state.slots[n].image.source !== "empty") expected++;
    if (buttons.length !== expected) return;
    var index = 0;
    for (var k = 0; k < state.count; k++) {
      var item = state.slots[k];
      if (!item.image || item.image.source === "empty") continue;
      var button = buttons[index++];
      var image = button.querySelector("img");
      var cap = button.querySelector(".wpr-lightbox-caption");
      if (image) image.alt = item.alt;
      if (cap) cap.textContent = item.caption;
      else if (item.caption && item.caption.trim()) {
        reloadPreview({ keepScroll: true, force: true });
        return;
      }
      var full = root.querySelector(".wpr-lightbox-full");
      var dialogCap = root.querySelector(".wpr-lightbox-dialog-caption");
      if (root.querySelector(".wpr-lightbox-dialog").open && full && full.src === image.src) {
        full.alt = item.alt;
        if (dialogCap) {
          dialogCap.textContent = item.caption || "";
          dialogCap.hidden = !item.caption || !String(item.caption).trim();
        }
      }
    }
  }

  function reloadPreview(opts) {
    var frame = document.getElementById("preview-frame");
    if (!frame) return;
    var keep = 0;
    if (opts && opts.keepScroll) {
      try { keep = frame.contentWindow.scrollY || 0; } catch (err) { keep = 0; }
    }
    frame._keepScroll = keep;
    previewNonce += 1;
    frame.srcdoc = buildExample(ui.part, partState(), opts && opts.force ? previewNonce : "");
  }

  function syncLocks() {
    var state = partState();
    var distance = document.getElementById("set-distance");
    if (distance) {
      var lockMove = state.settings.direction === "none";
      distance.disabled = lockMove;
      distance.closest(".nb-field").classList.toggle("is-locked", lockMove);
    }
    var duration = document.getElementById("set-duration");
    if (duration && ui.part === "image-lightbox") {
      var lockTime = state.settings.motion === "none";
      duration.disabled = lockTime;
      duration.closest(".nb-field").classList.toggle("is-locked", lockTime);
    }
  }

  function showAlert(message) {
    ui.alert = message;
    var node = document.getElementById("nb-alert");
    if (!node) return;
    node.hidden = false;
    node.textContent = message;
  }

  function clearAlert() {
    ui.alert = "";
    var node = document.getElementById("nb-alert");
    if (!node) return;
    node.hidden = true;
    node.textContent = "";
  }

  function readHeader(file) {
    return file.slice(0, 16).arrayBuffer();
  }

  function kindOf(bytes, mime) {
    var jpeg = bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff;
    var png = bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47;
    var webp = bytes.length >= 12 && bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46 && bytes[8] === 0x57 && bytes[9] === 0x45 && bytes[10] === 0x42 && bytes[11] === 0x50;
    if (jpeg && mime === "image/jpeg") return "image/jpeg";
    if (png && mime === "image/png") return "image/png";
    if (webp && mime === "image/webp") return "image/webp";
    return "";
  }

  function canDecode(url) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () { resolve(img.naturalWidth > 0 && img.naturalHeight > 0); };
      img.onerror = function () { resolve(false); };
      img.src = url;
    });
  }

  function readData(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || "")); };
      reader.onerror = function () { reject(new Error("read")); };
      reader.readAsDataURL(file);
    });
  }

  function onFile(index, file) {
    if (!file) return;
    var state = partState();
    if (file.size > LIMIT_ONE) {
      showAlert("1枚の上限は4MBです。小さい画像を選び直してください。ほかの素材はそのままです。");
      return;
    }
    if (usedBytes(state, index) + file.size > byteCap(ui.part)) {
      showAlert("このパーツの合計が" + (ui.part === "orbit-gallery" ? "20MB" : "12MB") + "を超えます。別の画像を減らすか、小さい画像を選んでください。ほかの素材はそのままです。");
      return;
    }
    readHeader(file).then(function (buffer) {
      var mime = kindOf(new Uint8Array(buffer), file.type);
      if (!mime) {
        showAlert("この形式には対応していません。JPEG、PNG、WebPを選んでください。ほかの素材はそのままです。");
        return;
      }
      return readData(file).then(function (dataUrl) {
        return canDecode(dataUrl).then(function (ok) {
          if (!ok) {
            showAlert("画像として読み込めませんでした。ファイルを選び直してください。ほかの素材はそのままです。");
            return;
          }
          state.slots[index].image = { source: "user", dataUrl: dataUrl, mime: mime, name: file.name || "image", bytes: file.size };
          clearAlert();
          paint();
        });
      });
    }).catch(function () {
      showAlert("ファイルを読み込めませんでした。選び直してください。ほかの素材はそのままです。");
    });
  }

  function bindText() {
    var state = partState();
    for (var i = 0; i < state.count; i++) {
      (function (index) {
        var map = [
          ["title", 40],
          ["body", 200],
          ["alt", 200],
          ["caption", 200]
        ];
        map.forEach(function (pair) {
          var input = document.getElementById("slot-" + index + "-" + pair[0]);
          if (!input) return;
          input.addEventListener("input", function () {
            var value = input.value.length > pair[1] ? input.value.slice(0, pair[1]) : input.value;
            state.slots[index][pair[0]] = value;
            patchPreview();
            refreshCode();
          });
        });
        var file = document.getElementById("slot-" + index + "-file");
        if (file) file.addEventListener("change", function () {
          var picked = file.files && file.files[0];
          file.value = "";
          onFile(index, picked);
        });
        var clear = document.getElementById("slot-" + index + "-clear");
        if (clear) clear.addEventListener("click", function () {
          state.slots[index].image = { source: "empty" };
          clearAlert();
          paint();
        });
      })(i);
    }
  }

  function bindSettings() {
    var state = partState();
    document.querySelectorAll('input[name="direction"]').forEach(function (input) {
      input.addEventListener("change", function () {
        if (!input.checked) return;
        state.settings.direction = input.value;
        syncLocks();
        reloadPreview({ keepScroll: true, force: true });
        refreshCode();
      });
    });
    document.querySelectorAll('input[name="replay"]').forEach(function (input) {
      input.addEventListener("change", function () {
        if (!input.checked) return;
        state.settings.replay = input.value;
        reloadPreview({ keepScroll: true, force: true });
        refreshCode();
      });
    });
    document.querySelectorAll('input[name="motion"]').forEach(function (input) {
      input.addEventListener("change", function () {
        if (!input.checked) return;
        state.settings.motion = input.value;
        syncLocks();
        reloadPreview({ keepScroll: true, force: true });
        refreshCode();
      });
    });
    var backdrop = document.getElementById("set-backdrop");
    if (backdrop) backdrop.addEventListener("change", function () {
      state.settings.backdrop = backdrop.checked;
      reloadPreview({ keepScroll: true, force: true });
      refreshCode();
    });
    document.querySelectorAll('input[name="spin"]').forEach(function (input) {
      input.addEventListener("change", function () {
        if (!input.checked) return;
        state.settings.direction = input.value;
        reloadPreview({ keepScroll: true, force: true });
        refreshCode();
      });
    });
    var auto = document.getElementById("set-auto");
    if (auto) auto.addEventListener("change", function () {
      state.settings.auto = auto.checked;
      reloadPreview({ keepScroll: true, force: true });
      refreshCode();
    });
    var detail = document.getElementById("btn-detail");
    if (detail) detail.addEventListener("click", function () {
      ui.orbitDetail = !ui.orbitDetail;
      ui.focusId = "btn-detail";
      paint();
    });
    [["set-duration", "duration", "ミリ秒"], ["set-stagger", "stagger", "ミリ秒"], ["set-distance", "distance", "ピクセル"], ["set-dim", "dim", "%"], ["set-max", "maxWidth", "ピクセル"], ["set-period", "period", "秒"], ["set-bright", "backBright", "%"], ["set-thick", "thick", "%"], ["set-back", "backScale", "%"]].forEach(function (spec) {
      var input = document.getElementById(spec[0]);
      if (!input) return;
      input.addEventListener("input", function () {
        state.settings[spec[1]] = Number(input.value);
        var label = document.getElementById("val-" + spec[0]);
        if (label) label.textContent = input.value + spec[2];
        reloadPreview({ keepScroll: true, force: true });
        refreshCode();
      });
    });
  }

  function bind() {
    document.querySelectorAll("[data-part]").forEach(function (button) {
      button.addEventListener("click", function () {
        ui.screen = "part";
        ui.part = button.getAttribute("data-part");
        ui.tab = "try";
        ui.alert = "";
        ui.confirm = false;
        paint();
      });
    });
    var back = document.getElementById("back-list");
    if (back) back.addEventListener("click", function () {
      ui.screen = "home";
      ui.confirm = false;
      paint();
    });
    document.querySelectorAll('[role="tab"]').forEach(function (tab) {
      tab.addEventListener("click", function () {
        ui.tab = tab.id.replace("tab-", "");
        ui.focusId = tab.id;
        ui.confirm = false;
        paint();
      });
    });
    var tabs = document.querySelector(".nb-tabs");
    if (tabs) tabs.addEventListener("keydown", function (event) {
      var order = ["try", "learn", "embed"];
      var index = order.indexOf(ui.tab);
      if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
      event.preventDefault();
      var next = event.key === "ArrowRight" ? (index + 1) % 3 : (index + 2) % 3;
      ui.tab = order[next];
      ui.focusId = "tab-" + ui.tab;
      paint();
    });
    var count = document.getElementById("slot-count");
    if (count) count.addEventListener("change", function () {
      var value = Number(count.value);
      var max = slotMax(ui.part);
      if (value >= 1 && value <= max) partState().count = value;
      paint();
    });
    var restart = document.getElementById("btn-restart");
    if (restart) restart.addEventListener("click", function () { reloadPreview({ force: true }); });
    var resetSettings = document.getElementById("btn-reset-settings");
    if (resetSettings) resetSettings.addEventListener("click", function () {
      partState().settings = defaultSettings(ui.part);
      ui.alert = "";
      paint();
    });
    var resetMaterials = document.getElementById("btn-reset-materials");
    if (resetMaterials) resetMaterials.addEventListener("click", function () {
      if (hasUserImage(partState())) {
        ui.confirm = true;
        ui.focusId = "nb-confirm-yes";
        paint();
        return;
      }
      var keep = partState();
      keep.slots = freshSlots(ui.part);
      keep.count = defaultCount(ui.part);
      ui.alert = "";
      paint();
    });
    var yes = document.getElementById("nb-confirm-yes");
    if (yes) yes.addEventListener("click", function () {
      var keep = partState();
      keep.slots = freshSlots(ui.part);
      keep.count = defaultCount(ui.part);
      ui.confirm = false;
      ui.alert = "";
      paint();
    });
    var no = document.getElementById("nb-confirm-no");
    if (no) no.addEventListener("click", function () {
      ui.confirm = false;
      ui.focusId = "btn-reset-materials";
      paint();
    });
    ["html", "css", "js"].forEach(function (kind) {
      var button = document.getElementById("code-" + kind);
      if (!button) return;
      button.addEventListener("click", function () {
        ui.codeKind = kind;
        ui.focusId = button.id;
        paint();
      });
    });
    var methodNew = document.getElementById("method-new");
    var methodOld = document.getElementById("method-existing");
    if (methodNew) methodNew.addEventListener("click", function () { ui.method = "new"; ui.focusId = "method-new"; paint(); });
    if (methodOld) methodOld.addEventListener("click", function () { ui.method = "existing"; ui.focusId = "method-existing"; paint(); });
    var copy = document.getElementById("btn-copy");
    if (copy) copy.addEventListener("click", copyCode);
    var saveCode = document.getElementById("btn-save-code");
    if (saveCode) saveCode.addEventListener("click", function () {
      var mime = ui.codeKind === "css" ? "text/css;charset=utf-8" : ui.codeKind === "js" ? "text/javascript;charset=utf-8" : "text/html;charset=utf-8";
      download(codeFileName(), currentCode(), mime);
    });
    var saveExample = document.getElementById("btn-save-example");
    if (saveExample) saveExample.addEventListener("click", function () {
      download(exampleName(), buildExample(ui.part, partState(), ""), "text/html;charset=utf-8");
    });
    var frame = document.getElementById("preview-frame");
    if (frame) frame.addEventListener("load", function () {
      var y = frame._keepScroll || 0;
      try { frame.contentWindow.scrollTo(0, y); } catch (err) {}
    });
    bindSettings();
    bindText();
    fillSlots(partState());
    refreshCode();
    if (frame) reloadPreview({ force: true });
  }

  function paint() {
    document.getElementById("app").innerHTML = ui.screen === "home" ? homeHtml() : partHtml();
    bind();
    if (ui.focusId) {
      var target = document.getElementById(ui.focusId);
      ui.focusId = "";
      if (target) target.focus();
    }
  }

  ["src-js-reveal", "src-js-lightbox", "src-js-orbit"].forEach(function (id) {
    try { new Function(source(id)); }
    catch (err) { console.error(id, err); }
  });

  var media = window.matchMedia("(prefers-reduced-motion: reduce)");
  if (media.addEventListener) media.addEventListener("change", function () { if (ui.screen === "part" && ui.tab === "try") paint(); });
  paint();
})();

</script>
</body>
</html>
